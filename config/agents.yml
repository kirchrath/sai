# Agenten-Definitionen. Wird in den Backend-Container gemountet (/config/agents.yml)
# und ersetzt die Standard-Agenten aus application.yml. Aenderungen erfordern einen Neustart:
#   docker compose restart backend
#
# Felder:
#   id            technische ID (a-z, 0-9, Bindestrich), Bezug fuer Unterhaltungen und Wissensbasis
#   name          Anzeigename
#   description   Kurzbeschreibung fuer das UI
#   provider      anthropic | openai
#   model         Modellname beim Provider
#   temperature   optional
#   max-tokens    optional
#   system-prompt System-Prompt
#   tools         datetime, calculator, web-fetch, knowledge
#   rag           true = passende Abschnitte aus der Wissensbasis automatisch mitgeben
sai:
  agents:
    - id: assistent
      name: Assistent
      description: Allgemeiner Assistent mit Basis-Tools
      provider: anthropic
      model: claude-sonnet-5-5
      max-tokens: 4096
      system-prompt: |
        Du bist ein hilfsbereiter Assistent. Antworte auf Deutsch, praezise und gut strukturiert.
        Nutze die verfuegbaren Tools, wenn sie die Antwort verbessern.
      tools: [datetime, calculator, web-fetch]

    - id: wissen
      name: Wissensassistent
      description: Beantwortet Fragen auf Basis der hochgeladenen Dokumente
      provider: anthropic
      model: claude-sonnet-5-5
      max-tokens: 4096
      temperature: 0.2
      system-prompt: |
        Du beantwortest Fragen ausschliesslich auf Basis der Wissensbasis. Nenne die Quelle (Dateiname).
        Wenn die Wissensbasis keine Antwort enthaelt, sage das offen.
      tools: [knowledge]
      rag: true

    - id: recherche
      name: Recherche (OpenAI)
      description: Recherchiert im Web und rechnet nach
      provider: openai
      # Modellnamen an den eigenen OpenAI-Zugang anpassen
      model: gpt-5
      system-prompt: |
        Du recherchierst gruendlich im Web, gibst URLs als Quellen an und antwortest auf Deutsch.
      tools: [web-fetch, datetime, calculator]
