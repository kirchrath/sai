name: sai

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: sai
      POSTGRES_USER: ${SAI_DB_USER:-sai}
      POSTGRES_PASSWORD: ${SAI_DB_PASSWORD:?SAI_DB_PASSWORD in .env setzen}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d sai"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: keycloak/keycloak:26.8.2
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${SAI_DB_USER:-sai}
      KC_DB_PASSWORD: ${SAI_DB_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${SAI_PUBLIC_URL:?SAI_PUBLIC_URL in .env setzen}/auth
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # Veraltete Optionen/Features abschalten (nicht genutzt: Social Login/Identity Brokering)
      KC_SPI_STICKY_SESSION_ENCODER__INFINISPAN__SHOULD_ATTACH_ROUTE: "false"
      KC_FEATURES_DISABLED: identity-brokering-api,twitter-broker
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD in .env setzen}
      # Platzhalter fuer den Realm-Import (keycloak/realm-sai.json)
      SAI_PUBLIC_URL: ${SAI_PUBLIC_URL}
      SAI_KEYCLOAK_SSL_REQUIRED: ${SAI_KEYCLOAK_SSL_REQUIRED:-external}
      SAI_ADMIN_PASSWORD: ${SAI_ADMIN_PASSWORD:?SAI_ADMIN_PASSWORD in .env setzen}
      SAI_USER_PASSWORD: ${SAI_USER_PASSWORD:?SAI_USER_PASSWORD in .env setzen}
      SAI_MCP_CLIENT_SECRET: ${SAI_MCP_CLIENT_SECRET:?SAI_MCP_CLIENT_SECRET in .env setzen}
    volumes:
      - ./keycloak/realm-sai.json:/opt/keycloak/data/import/realm-sai.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 20

  backend:
    build: ./backend
    image: sai-backend:latest
    restart: unless-stopped
    environment:
      SAI_DB_URL: jdbc:postgresql://postgres:5432/sai
      SAI_DB_USER: ${SAI_DB_USER:-sai}
      SAI_DB_PASSWORD: ${SAI_DB_PASSWORD}
      SAI_OIDC_ISSUER_URI: ${SAI_PUBLIC_URL}/auth/realms/sai
      SAI_OIDC_JWK_SET_URI: http://keycloak:8080/auth/realms/sai/protocol/openid-connect/certs
      SAI_MAX_UPLOAD_SIZE: ${SAI_MAX_UPLOAD_MB:-25}MB
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./config/agents.yml:/config/agents.yml:ro
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: sai-frontend:latest
    restart: unless-stopped
    environment:
      SAI_MAX_UPLOAD_MB: ${SAI_MAX_UPLOAD_MB:-25}
    ports:
      - "${SAI_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_started
      keycloak:
        condition: service_started

volumes:
  postgres-data:
